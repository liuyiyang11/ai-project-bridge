control_repo: "OWNER/ai-project-bridge"
trusted_github_logins:
  - "YOUR-GITHUB-LOGIN"
poll_seconds: 30

codex:
  backend: app-server
  routing_policy: inherit

limits:
  max_artifact_file_mb: 25
  max_bundle_mb: 100
  max_images: 20

projects:
  code-project:
    capabilities: [code, experiment-review]
    root: "D:/Projects/code-project"
    repo: "OWNER/code-project"
    remote: origin
    base_branch: main
    allowed_commands:
      quick_test:
        argv: ["python", "-m", "pytest", "-q"]
      evaluate:
        argv: ["python", "tools/evaluate.py"]
    artifact_dirs: ["outputs", "results", "runs"]

  thesis-ppt:
    capabilities: [presentation]
    root: "D:/Presentations/ThesisDefense"
    repo: "OWNER/ThesisDefense"
    remote: origin
    base_branch: main
    allowed_commands: {}
    artifact_dirs: []

  experiment-project:
    capabilities: [experiment-review]
    root: "D:/Projects/experiment-project"
    repo: "OWNER/experiment-project"
    remote: origin
    base_branch: main
    allowed_commands:
      evaluate:
        argv: ["python", "tools/evaluate.py"]
    artifact_dirs: ["outputs", "results", "runs"]

# Optional synchronous market-data fast path. Real paths belong only in
# ignored config.local.yaml; leave disabled in the portable example.
market_data:
  enabled: false
  root: null
  python_executable: null
  default_timeout_seconds: 30
  market_context_timeout_seconds: 12


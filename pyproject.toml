[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-project-bridge"
version = "0.2.0"
description = "A safe local bridge between GitHub Issues and Windows AI project execution."
requires-python = ">=3.9"
dependencies = [
  "pydantic>=1.10",
  "PyYAML>=6.0",
]

[project.optional-dependencies]
test = ["pytest>=7.0"]
presentation = [
  "PyMuPDF>=1.23",
  "Pillow>=10.0",
  "pywin32>=306; sys_platform == 'win32'",
]

[project.scripts]
bridge = "bridge.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.setuptools.packages.find]
include = ["bridge*"]
